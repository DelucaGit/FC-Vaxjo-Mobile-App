# Test profile (used by @ActiveProfiles("test")). Values here are TEST-ONLY and never used in dev or production.
# In-memory H2 so role tests do not need a local PostgreSQL. MODE=PostgreSQL keeps the existing column definitions working.
spring.datasource.url=jdbc:h2:mem:fcvaxjo_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.jwt.secret=test-only-jwt-secret-not-for-production-0000000000
# No seed passwords in tests: AdminSeeder and DemoClubSeeder skip their work.
app.seed.admin-password=
app.seed.demo-password=

# Shared login phrase for the fictional club in ClubFixture. Not a real password.
app.test.shared-login=test-only-club-login
app.test.rotated-login=test-only-club-login-2
