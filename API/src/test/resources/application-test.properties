# Test profile (used by @ActiveProfiles("test")). Values here are TEST-ONLY and never used in dev or production.
app.jwt.secret=test-only-jwt-secret-not-for-production-0000000000
# No seed passwords in tests: AdminSeeder and DemoClubSeeder skip their work.
app.seed.admin-password=
app.seed.demo-password=

# In-memory database so the JWT tests can run without a local Postgres.
# The running API still uses PostgreSQL (see application.properties).
spring.datasource.url=jdbc:h2:mem:fcvaxjo;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
