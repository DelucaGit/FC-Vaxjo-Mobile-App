# Production profile. Turn it on with the environment variable
# SPRING_PROFILES_ACTIVE=prod. Do not also set dev.
# No secrets in this file. Database password and JWT secret stay in
# environment variables (DB_PASSWORD, JWT_SECRET, and the seed passwords).
spring.jpa.show-sql=false

# The phone's real IP, for the login lockout (issue #64, ADR 0008).
# On Render every request reaches us through Render's proxy, so
# getRemoteAddr() would be the proxy's IP for everyone. These settings were
# written for Railway, whose edge puts the phone's IP in X-Real-IP.
# NOT VERIFIED FOR RENDER (#158): check after the first deploy which header
# Render sets (docs/deploy-render.md). Until then, if getRemoteAddr() is still
# an internal address, the lockout falls back to the email alone (5 failures).
# "native" lets Tomcat's RemoteIpValve copy X-Real-IP into getRemoteAddr(),
# but ONLY when the request comes from an internal proxy address.
# We do NOT set server.tomcat.remoteip.internal-proxies: Spring Boot's default
# list (10/8, 172.16/12, 192.168/16, 169.254/16, 100.64/10, 127/8, fc00::/7,
# fe80::/10, ::1) already covers Railway's proxy, and a request straight from
# the internet is never on it, so a faked header from a phone is ignored.
# Do not use "framework" instead: it trusts the header from anyone.
# X-Forwarded-For is not used, because it can contain internal hops.
server.forward-headers-strategy=native
server.tomcat.remoteip.remote-ip-header=X-Real-IP
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto

# Neon Free allows few connections and puts the database to sleep after 5
# minutes without use (#158). A small pool keeps us far below the limit.
# Hikari checks a connection before lending it out, so one that died during
# the sleep is replaced instead of failing a request.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
