spring.application.name=api

# No profile is active unless the environment variable SPRING_PROFILES_ACTIVE is set.
# Do not add a fallback here. A missing variable must keep these safe values
# (SQL logging off, and DemoClubSeeder is not created). Local demo data needs
# SPRING_PROFILES_ACTIVE=dev in the start command. See the README.

spring.datasource.url=jdbc:postgresql://localhost:5432/fcvaxjo_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
# SQL logging is off unless a profile turns it on. Dev does. Prod does not (F9).
# A forgotten profile must not print queries that can contain email or phone.
spring.jpa.show-sql=false

# JWT signing key. No default on purpose: set JWT_SECRET in API/.env (local) or Railway variables.
# The app refuses to start if it is missing or shorter than 32 bytes.
app.jwt.secret=${JWT_SECRET}
# 120 minutes (120 * 60 * 1000)
app.jwt.expiration-ms=7200000

# Seed data. Passwords are never in code or Git: set them in API/.env (see .env.example).
# Empty password = that seeder skips its work.
app.seed.admin-email=${BOOTSTRAP_ADMIN_EMAIL:admin@fcvaxjo.se}
app.seed.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.seed.demo-password=${DEMO_PASSWORD:}
# true = the dev demo seed resets the admin and all demo passwords on every start.
app.seed.reset-passwords=${DEMO_RESET_PASSWORDS:false}
