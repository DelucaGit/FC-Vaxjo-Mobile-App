spring.application.name=api

# Local runs default to the "dev" profile (demo seed data). Railway/production sets SPRING_PROFILES_ACTIVE to something else.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.url=jdbc:postgresql://localhost:5432/fcvaxjo_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT signing key. No default on purpose: set JWT_SECRET in API/.env (local) or Railway variables.
# The app refuses to start if it is missing or shorter than 32 bytes.
app.jwt.secret=${JWT_SECRET}
# 120 minutes (120 * 60 * 1000)
app.jwt.expiration-ms=7200000

# Seed data. Passwords are never in code or Git: set them in API/.env (see .env.example).
# Empty password = that seeder skips its work.
app.seed.admin-email=${BOOTSTRAP_ADMIN_EMAIL:admin@fcvaxjo.se}
app.seed.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.seed.demo-password=${DEMO_PASSWORD:}
