spring.application.name=api

spring.datasource.url=jdbc:postgresql://localhost:5432/fcvaxjo_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Local JWT signing key (override with JWT_SECRET in real environments).
# Must be long enough for HS256 (at least 32 characters).
app.jwt.secret=${JWT_SECRET:fcvaxjo-local-dev-jwt-secret-change-me-32chars}
app.jwt.expiration-ms=86400000