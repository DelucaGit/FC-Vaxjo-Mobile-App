# Test profile only — these values are fake and never used in real deploys.
spring.datasource.url=jdbc:h2:mem:fcvaxjo;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Satisfies ${JWT_SECRET} / ${DB_PASSWORD} placeholders when tests start.
DB_PASSWORD=test-db-password-not-used-by-h2
JWT_SECRET=test-only-jwt-secret-key-at-least-32-chars-long

fcvaxjo.jwt.secret=test-only-jwt-secret-key-at-least-32-chars-long
fcvaxjo.jwt.expiration-ms=3600000

fcvaxjo.admin.seed=true
fcvaxjo.admin.email=admin@fcvaxjo.local
fcvaxjo.admin.password=changeme
fcvaxjo.admin.first-name=Club
fcvaxjo.admin.last-name=Admin

fcvaxjo.cors.allowed-origins=http://localhost:8081
