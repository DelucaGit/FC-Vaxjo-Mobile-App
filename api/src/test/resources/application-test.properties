# Used only when tests run (profile = test).
# H2 is an in-memory database — no PostgreSQL install needed for tests.
spring.datasource.url=jdbc:h2:mem:fcvaxjo;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

fcvaxjo.jwt.secret=test-only-jwt-secret-key-at-least-32-chars
fcvaxjo.jwt.expiration-ms=3600000

fcvaxjo.admin.email=admin@fcvaxjo.local
fcvaxjo.admin.password=changeme
fcvaxjo.admin.first-name=Club
fcvaxjo.admin.last-name=Admin
