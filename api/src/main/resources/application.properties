spring.application.name=api

# --- Local PostgreSQL (free on your machine via Docker) ---
# Start DB with: docker compose up -d
spring.datasource.url=jdbc:postgresql://localhost:5432/fcvaxjo
spring.datasource.username=fcvaxjo
spring.datasource.password=fcvaxjo

# Hibernate creates/updates tables from our @Entity classes.
# Good for learning. Later we switch to Flyway migrations for production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# PostgreSQL dialect is auto-detected by Spring Boot in most cases.
spring.jpa.open-in-view=false

# --- JWT / local admin (change these before any real deploy) ---
# Secret must be long (at least 32 characters for HS256).
fcvaxjo.jwt.secret=local-dev-only-change-me-fcvaxjo-jwt-secret-key
# Token lifetime in milliseconds (86400000 = 24 hours)
fcvaxjo.jwt.expiration-ms=86400000

# Created automatically on startup if this email does not exist yet.
fcvaxjo.admin.email=admin@fcvaxjo.local
fcvaxjo.admin.password=changeme
fcvaxjo.admin.first-name=Club
fcvaxjo.admin.last-name=Admin
