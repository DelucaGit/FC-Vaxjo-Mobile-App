spring.application.name=api

# Non-secret defaults. Secrets MUST come from environment variables.
# See .env.example — never commit a real .env file.

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fcvaxjo}
spring.datasource.username=${DB_USER:fcvaxjo}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT — DB_PASSWORD / JWT_SECRET / ADMIN_PASSWORD are required (no insecure defaults in code)
fcvaxjo.jwt.secret=${JWT_SECRET}
fcvaxjo.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

fcvaxjo.admin.seed=${ADMIN_SEED:false}
fcvaxjo.admin.email=${ADMIN_EMAIL:admin@fcvaxjo.local}
fcvaxjo.admin.password=${ADMIN_PASSWORD:}
fcvaxjo.admin.first-name=${ADMIN_FIRST_NAME:Club}
fcvaxjo.admin.last-name=${ADMIN_LAST_NAME:Admin}

# Comma-separated browser origins allowed to call the API (Expo web / local tools)
fcvaxjo.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006,http://127.0.0.1:8081}

# Actuator: only health, for Docker healthchecks
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
