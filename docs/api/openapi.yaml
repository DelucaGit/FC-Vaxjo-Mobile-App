            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MatchResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Matches]
      operationId: createMatch
      summary: Skapa match
      description: |
        Resultatet är valfritt. Båda måltalen utelämnas, eller båda skickas.
        Ett ensamt måltal är 400. `createdByUserId` sätts till den inloggade.
        ADMIN och CHAIRMAN får skapa matchen på vilket lag som helst.
        `kickoffAt` får inte ligga före nu (datum och klockslag, svensk tid Europe/Stockholm), annars 400 (#115).
        ADMIN är undantagen och får sätta vilken tid som helst. En match flyttas med `PUT /api/matches/{id}` (#127).
        Fel: "teamId is required", "opponent is required", "kickoffAt is required",
        "Starttiden har redan passerat. Välj en tid som inte har varit." (400, inte ADMIN),
        "venue is required", "homeAway is required (HOME or AWAY)", "homeAway must be HOME or AWAY",
        "goalsFor and goalsAgainst must both be set, or both left empty",
        "goalsFor and goalsAgainst cannot be negative" (400);
        "Only ADMIN, CHAIRMAN, or a coach of this team can manage matches" (403 om COACH inte tränar laget, kontrolleras först);
        PLAYER och PARENT får 403 från `@PreAuthorize`;
        "Team not found" (404).
      x-roles: [ADMIN, CHAIRMAN, COACH]
      x-scope: ADMIN och CHAIRMAN alla lag. COACH endast lag där hen finns i `team_coaches`.
      x-source: MatchController.create → MatchService.createMatch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMatchRequest' }
