      description: |
        ADMIN och CHAIRMAN får hämta en match i vilket lag som helst.
        En saknad match är 404 "Match not found" för ADMIN och CHAIRMAN.
        För en COACH är en saknad match och en match i ett annat lag samma 403,
        så svaret inte säger att id:t finns.
        PLAYER och PARENT får 403 från `@PreAuthorize`.
      x-roles: [ADMIN, CHAIRMAN, COACH]
      x-scope: ADMIN och CHAIRMAN alla lag. COACH endast lag där hen finns i `team_coaches`.
      x-source: MatchController.getById → MatchService.getById
      responses:
        '200':
          description: Matchen.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

    put:
      tags: [Matches]
      operationId: updateMatch
      summary: Ändra motståndare, avspark, plats och hemma/borta
      description: |
        Byter `opponent`, `kickoffAt`, `venue` och `homeAway` (#127). Laget kan inte bytas,
        så närvaroraderna och resultatet ligger kvar. Resultatet ändras med `PUT /api/matches/{id}/result`.
        Samma roller och lag som när matchen skapas. Alla fyra fälten krävs, precis som vid skapande.
        En ny `kickoffAt` får inte ligga före nu (svensk tid), annars 400 (#115). ADMIN är undantagen.
        Kontrollen görs bara när `kickoffAt` ändras: att rätta platsen på en gammal match med samma tid går igenom.
        Samma 403 för en COACH när id saknas och när matchen hör till ett annat lag.
        Fel: "opponent is required", "kickoffAt is required",
        "Starttiden har redan passerat. Välj en tid som inte har varit." (400, inte ADMIN),
        "venue is required", "homeAway is required (HOME or AWAY)", "homeAway must be HOME or AWAY" (400);
        "Only ADMIN, CHAIRMAN, or a coach of this team can manage matches" (403, kontrolleras först);
        PLAYER och PARENT får 403 från `@PreAuthorize`;
        "Match not found" (404 för ADMIN och CHAIRMAN).
      x-roles: [ADMIN, CHAIRMAN, COACH]
      x-scope: ADMIN och CHAIRMAN alla lag. COACH endast lag där hen finns i `team_coaches`.
      x-source: MatchController.update → MatchService.updateMatch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMatchRequest' }
      responses:
        '200':
          description: Den ändrade matchen.
          content:
