openapi: 3.1.0
info:
  title: FC Växjö Club API
  version: 0.0.1-SNAPSHOT
  summary: Klubbappens backend (Spring Boot 4.1, Java 21, PostgreSQL, JWT).
  description: |
    Beskriver **nuvarande** endpoints i `API/src/main/java/se/fcvaxjo/api/controller/`.
    Grundläget lästes 2026-11-05 på grenen `feature/player-parent-trainings-view` (commit d21b180).
    Implementerade delar är dokumenterade i efterhand ("as-is").
    `GET /api/public/**` är öppet utan token (ADR 0003). Andra metoder under den sökvägen är det inte.
    Ingen spelardata är någonsin publik (ADR 0007).
    Träningsschema och tränarkontakt är kvar som `x-status: planned`.
    `CHAIRMAN` finns som roll (ADR 0006). Behörigheter som ännu inte matchar ADR:n
    är markerade med `x-roles-planned`.

    Läsning av persondata (sök, en annan användare, lagets tränare och spelare)
    kräver ADMIN, CHAIRMAN eller COACH. PLAYER och PARENT får 403.
    ADMIN och CHAIRMAN ser hela klubben. COACH ser bara lag där hen finns i `team_coaches`.
    Hela användarlistan `GET /api/users` är bara ADMIN och CHAIRMAN.
    Undantag: `GET /api/users/{id}` när id är den inloggade själv.

    **Konventioner**
    - Tekniska namn på engelska, beskrivningar på svenska.
    - `x-roles`: vilka roller som får anropa operationen (från `SecurityConfig` + `@PreAuthorize`).
      `ANY_AUTHENTICATED` betyder: alla inloggade, oavsett roll (ADMIN, CHAIRMAN, COACH, PLAYER, PARENT).
    - `x-scope`: ytterligare kontroll i service-lagret (t.ex. att en COACH bara får hantera sina egna lag).
    - `x-pii: true`: fältet innehåller personuppgifter (GDPR).
    - `x-secret: true`: fältet innehåller en hemlighet (lösenord/token).
    - `x-source`: fil och metod i koden som operationen bygger på.
    - `x-status: planned`: **ej implementerat**. Planerat enligt ADR 0003 och 0006. Allt utan `x-status` är implementerat.
    - `x-roles-planned` / `x-scope-planned`: planerad behörighet (ADR 0006) som skiljer sig från nuläget.

    **Validering.** DTO-klasserna har **inga** Bean Validation-annoteringar (`@NotNull`, `@NotBlank`, `@Size`,
    `@Email` m.fl. används inte och `@Valid` saknas på `@RequestBody`), trots att `spring-boot-starter-validation`
    finns i `pom.xml`. All validering görs manuellt i service-klasserna och kastar `BadRequestException` (400).
    `required` och andra regler nedan speglar de manuella kontrollerna.

    **Felhantering** (`ApiExceptionHandler`, `SecurityConfig`):
    - `BadRequestException` → 400 `{ "message": ... }`
    - `UnauthorizedException` på `POST /api/auth/login` → 401 `{ "message": "Invalid email or password" }`
      (fel lösenord, okänd e-post, inaktivt konto och konto utan lösenord ger samma text)
    - `NotFoundException` → 404 `{ "message": ... }`
    - `AccessDeniedException` (även `@PreAuthorize`-nekanden) → 403 `{ "message": ... }`
    - Saknad, ogiltig eller utgången JWT, eller en JWT för ett inaktivt konto, en roll som inte längre stämmer, eller en token utfärdad före senaste lösenordsbytet → 401 `{ "message": "Login required" }`
    - Övriga fel (felaktig JSON, fel typ på path/query-parameter, DB-constraint-fel) hanteras **inte** av
      `ApiExceptionHandler` och får Springs standardsvar (400/500); formatet är inte verifierat, se öppna frågor.

    **Tid.** `startsAt`/`endsAt` är Java `LocalDateTime` utan tidszon, serialiserade som ISO-8601
    (`2026-11-06T18:00:00`). Därför används inte `format: date-time` (RFC 3339 kräver offset).
servers:
  - url: http://localhost:8080
    description: Lokal utveckling (V1). Produktion (Railway) finns ännu inte.
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Inloggning, lösenordsbyte och förnyelse av JWT.
  - name: Users
    description: Klubbens användare (ADMIN, CHAIRMAN, COACH, PLAYER, PARENT).
  - name: Teams
    description: Lag och lagets tränare/spelare.
  - name: Trainings
    description: Träningar och närvaro (personal-vy).
  - name: Matches
    description: Matcher och resultat (personal-vy). Spelare och föräldrar läser via `/api/my/matches`.
  - name: MySchedule
    description: Den inloggades egna vy (`/api/my`).
  - name: Public
    description: |
      Publika GET-anrop för hemsidan (ADR 0003 och ADR 0007). Ingen inloggning.
      Lag, kommande matcher och matchhistorik. Aldrig spelardata och aldrig kontaktuppgifter.
      `PublicLeakTest` kontrollerar alla publika GET-endpoints.
      Träningsschema och tränarkontakt är kvar som `x-status: planned`.
      Bara GET under `/api/public/**` är öppet. Andra metoder kräver inloggning.

paths:
  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Logga in med e-post och lösenord
      description: |
        Publik endpoint. Returnerar en JWT (giltig 120 min, `app.jwt.expiration-ms=7200000`).
        Saknad e-post eller saknat lösenord ger **400** "Email and password are required".
        Fel lösenord, okänd e-post, inaktivt konto och konto utan lösenord ger alla
        samma **401** "Invalid email or password". Svaret säger inte om kontot finns.
        När e-posten saknas körs ändå en BCrypt-jämförelse, så svaret inte blir tydligt snabbare än en vanlig kontroll.
        För många misslyckade försök ger **429** i 15 minuter (se 429 nedan och ADR 0008).
      security: []
      x-roles: [PUBLIC]
      x-source: AuthController.login → AuthService.login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Inloggad.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: |
            Fel lösenord, okänd e-post, inaktivt konto eller konto utan lösenord.
            Body är alltid `{"message":"Invalid email or password"}`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { message: "Invalid email or password" }
        '429':
          description: |
            För många misslyckade inloggningar (#64, ADR 0008). Spärren gäller i 15 minuter,
            även med rätt lösenord, och slår till vid:
            - 5 misslyckade försök för samma e-post från samma IP,
            - 30 misslyckade försök från samma IP (oavsett e-post),
            - 20 misslyckade försök för samma e-post (oavsett IP).
            Ett misslyckat försök glöms 15 minuter efter det senaste. En lyckad inloggning
            nollställer räknarna för e-post+IP och e-post (inte IP). Okänd e-post räknas likadant,
            så spärren avslöjar inte om kontot finns. Räknarna ligger i minnet, och IP sparas bara som HMAC.
            Svaret innehåller aldrig IP-adressen.
            Klientens IP är `getRemoteAddr()`. I prod sätter Tomcat den från `X-Real-IP`, men bara när
            anropet kommer från en intern proxy (Railway). Är IP:n ändå intern (privat, 100.64/10, loopback)
            hoppas IP-reglerna över, och e-posten spärras ensam efter 5 försök.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { message: "För många inloggningsförsök. Försök igen om 15 minuter." }

  /api/auth/change-password:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: Byt eget lösenord
      description: |
        Kräver giltig JWT. Sätter `mustChangePassword=false` och skriver en ny hash.
        Varje ny hash, även när en användare skapas eller demo-lösenordet skrivs om,
        sätter `passwordChangedAt` (F5). En token som utfärdades i en tidigare sekund
        får 401 på nästa anrop (`{"message":"Login required"}`). `iat` har bara
        sekundprecision, så ett byte i samma sekund som token släpper den token igenom.
        Den första inloggningen efter att kontot skapats fungerar därför.
        Fel: "Current password is required", "New password must be at least 8 characters",
        "Current password is wrong" (400); "User not found" (404).
      x-roles: [ANY_AUTHENTICATED]
      x-source: AuthController.changePassword → AuthService.changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200':
          description: Lösenordet är bytt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: Förnya JWT
      description: |
        Kräver en JWT som fortfarande är signerad, inte gått ut, tillhör ett aktivt konto
        och har samma roll som i databasen. Returnerar en ny token (ytterligare 120 min).
        Ingen request body.
        Inaktivt konto, borttagen användare, en roll som inte längre stämmer, eller en token
        utfärdad före senaste lösenordsbytet ger 401.
        Efter ett rollbyte måste personen logga in igen. Förnyelse kan inte byta in den nya rollen.
        Efter ett lösenordsbyte gäller token som bytet returnerade. En äldre token får 401.
      x-roles: [ANY_AUTHENTICATED]
      x-source: AuthController.refresh → AuthService.refresh
      responses:
        '200':
          description: Ny token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: Lista alla aktiva användare
      description: |
        Returnerar alla användare med `active=true`, inklusive kontaktuppgifter och förälderns kontaktuppgifter.
        Bara ADMIN och CHAIRMAN. Listan är hela klubben, inte ett lag.
        COACH, PLAYER och PARENT får 403. En tränare listar personer via lagets spelare och tränare.
      x-roles: [ADMIN, CHAIRMAN]
      x-scope: Hela klubben. COACH använder lagets spelare och tränare, bara för lag i team_coaches.
      x-source: UserController.getAllUsers → UserService.getAllUsers
      responses:
        '200':
          description: Lista med användare.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FetchUserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Users]
      operationId: createUser
      summary: Skapa användare med temporärt lösenord
      description: |
        ADMIN får skapa alla roller, inklusive en fristående `PARENT` (en förälder utan barn).
        CHAIRMAN får skapa `PLAYER`, `PARENT` och `COACH` i vilket lag som helst, inklusive en fristående förälder.
        CHAIRMAN som sätter `ADMIN` eller `CHAIRMAN` får 403
        "CHAIRMAN cannot assign the role ADMIN or CHAIRMAN".
        COACH får bara skapa `PLAYER` i ett lag hen tränar.
        En förälder som COACH skapar måste skickas som `newParent` på en aktiv spelare i det laget (beslut b).
        `roleName=PARENT` från en COACH ger 400
        "A COACH cannot create a standalone parent. Create the parent together with a player on a team you train".
        En dubblett av e-post eller telefon ger tränaren 400 "Could not create the user",
        oavsett om personen ligger i eget lag eller inte (F7). Texten säger inte vilket fält.
        ADMIN och CHAIRMAN får fortfarande "User already exists" och "Phone number already in use".
        Annan otillåten roll ger 403
        "Only ADMIN, CHAIRMAN or COACH can create users. A CHAIRMAN may create PLAYER, PARENT and COACH. A COACH may only create PLAYER".

        För `roleName=PLAYER` gäller:
        - `teamId` krävs (400 "A PLAYER needs a teamId"),
        - COACH måste träna det laget (rad i `team_coaches`). Annars 403
          "Only ADMIN, CHAIRMAN, or a coach of this team can manage its players".
          Kontrollen sker före kontrollen att laget finns, så en coach får 403 även för ett okänt lag-id,
        - ADMIN och CHAIRMAN: laget måste finnas (400 "Team not found"),
        - exakt en av `parentId` eller `newParent` (annars 400),
        - `parentId` måste peka på en aktiv användare med roll PARENT.
          Inaktiv förälder ger 400 "Cannot link an inactive parent".
          Annan roll ger 400 "parentId must point to a user with role PARENT".
        `newParent` sparas bara om lagkontrollen redan har gått igenom. Då pekar spelarens `parentId` på den nya föräldern.
        För andra roller ignoreras `parentId`, `newParent` och `teamId`.
        När `roleName` är `COACH` sparas inte `playerNumber`, även om det skickas med. En tränare har inget tröjnummer.
        En ny COACH får alltså inget lag, ingen förälder och inget tröjnummer här. Att koppla tränaren till ett lag
        görs med `POST /api/teams/{id}/coaches` och ingår inte i det här anropet.
        Ett tröjnummer som redan finns ger 400 "Shirt number already in use" för ADMIN och CHAIRMAN,
        kontrollerat före insert (F10). En tränare får samma 400 som övriga dubbletter: "Could not create the user".
        Kroppen har ingen stacktrace och ingen SQL.

        Övriga regler: `email` krävs och måste vara unik ("User already exists"); `mobilePhoneNumber` unik om satt.
        Ett temporärt lösenord (10 tecken) genereras och returneras **en gång** i svaret; `mustChangePassword=true`.
      x-roles: [ADMIN, CHAIRMAN, COACH]
      x-scope: |
        ADMIN får skapa alla roller. CHAIRMAN får skapa PLAYER, PARENT och COACH, aldrig ADMIN eller CHAIRMAN.
        COACH får skapa PLAYER bara i lag där hen finns i `team_coaches`, och PARENT bara som `newParent` på den spelaren.
      x-source: UserController.createUser → UserService.createUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '201':
          description: Användaren skapad.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateUserResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/users/search:
    post:
      tags: [Users]
      operationId: searchUsers
      summary: Sök användare på namn, tröjnummer eller telefon
      description: |
        Sökvärdet ligger i JSON-kroppen, inte i URL:en, så en access-logg inte sparar
        namn, tröjnummer eller telefon (F1, ADR 0004).
        Skicka **exakt ett** av fälten `name`, `playerNumber` och `phone`. Annars 400
        "Send exactly one of name, playerNumber or phone".
        - `name` → delsträng, skiftlägesokänslig, bara aktiva. Returnerar **array** (kan vara tom). Tomt namn räknas inte som ifyllt.
        - `playerNumber` → exakt tröjnummer. Returnerar **ett objekt**. Saknas/inaktiv → 404
          med texten "User not found". Numret upprepas inte (F2).
        - `phone` → exakt mobilnummer. Returnerar **ett objekt**. Saknas/inaktiv → 404
          med texten "User not found". Numret upprepas inte i feltexten (ADR 0004).
        `GET /api/users/search` finns, men svarar 405 och söker inte. Använd POST.
        Bara ADMIN, CHAIRMAN och COACH. PLAYER och PARENT får 403,
        eftersom träffen innehåller kontaktuppgifter.
        ADMIN och CHAIRMAN söker i hela klubben.
        COACH får bara träffar på lag där hen finns i `team_coaches`:
        spelare med det `teamId`, tränare kopplade till de lagen, och föräldrar till aktiva spelare där.
        Namnsök mot ett annat lag ger 200 och en tom lista.
        Tröjnummer eller telefon som inte ligger på de lagen ger samma 404 som om personen saknas.
        Telefonens 404-text är "User not found" och upprepar inte numret (S1-12).
        Tröjnumrets 404-text är samma "User not found" och upprepar inte numret (F2).
        Mobilappen måste byta från GET med query till den här POST-kroppen. UI/ rörs inte här.
      x-roles: [ADMIN, CHAIRMAN, COACH]
      x-scope: ADMIN och CHAIRMAN hela klubben. COACH endast egna lag (`team_coaches`).
      x-source: UserController.search
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SearchUsersRequest' }
      responses:
        '200':
          description: Array vid `name`, ett objekt vid `playerNumber` eller `phone`.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: { $ref: '#/components/schemas/FetchUserResponse' }
                  - $ref: '#/components/schemas/FetchUserResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405':
          description: GET /api/users/search finns men svarar 405. Sökningen är POST.

  /api/users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      operationId: getUserById
      summary: Hämta en användare
      description: |
        Bara aktiva användare (`active=true`).
        ADMIN och CHAIRMAN får 404 "User not found" både när id saknas och när raden är inaktiv (S1-13).
        PLAYER, PARENT och COACH får 403 i båda fallen (F3, Arkitekten). Samma text som för ett id de inte får läsa,
        så statuskoden inte säger att kontot finns. Det gäller också en rad de skulle få se om den var aktiv,
        till exempel tränaren i spelarens eget lag.
        Att slå på kontot igen blir en egen endpoint senare. Den finns inte här.
        ADMIN och CHAIRMAN får hämta vem som helst som är aktiv. De är inte begränsade till ett lag.
        COACH får hämta en aktiv person på ett lag hen tränar (spelarens `teamId`, en tränare i `team_coaches`,
        eller en förälder till en aktiv spelare där), och sitt eget id.
        Annat id, ett id som saknas, eller en inaktiv rad ger 403 "You can only read users on a team you train".
        PLAYER och PARENT får bara hämta sitt eget id (samma id som i JWT).
        Annat id, ett id som saknas, eller en inaktiv rad ger 403 "You can only read your own user record".
        ADMIN eller CHAIRMAN som frågar efter ett okänt id får "User not found" (404).

        En spelare som hämtar sig själv får sina egna fält, men inte `parentName`,
        `parentEmail` eller `parentMobilePhoneNumber` (F6, beslut c). Tränaren i laget,
        ADMIN och CHAIRMAN ser de fälten när föräldern är aktiv.
      x-roles: [ADMIN, CHAIRMAN, COACH, PLAYER, PARENT]
      x-scope: |
        ADMIN och CHAIRMAN alla lag, bara aktiva användare. Saknad och inaktiv är 404.
        COACH endast aktiva personer på lag i `team_coaches`, plus eget id. Saknad och inaktiv är 403.
        PLAYER och PARENT endast eget användar-id. Saknad och inaktiv är 403.
      x-source: UserController.getUserById → UserService.readActiveUser
      responses:
        '200':
          description: Användaren.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FetchUserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: |
            Okänt id, eller en inaktiv användare (`active=false`), för ADMIN och CHAIRMAN.
            Texten är "User not found" i båda fallen.
            PLAYER, PARENT och COACH får 403 i stället, samma som för ett id de inte får läsa (F3).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      tags: [Users]
      operationId: softDeletePlayer
      summary: Mjukradera en spelare (active=false)
      description: |
        Sätter `active=false` på en PLAYER. Raden och all data ligger kvar i databasen (ingen hård radering).
        Spelaren försvinner från laglistorna.
        COACH får bara göra det när spelaren ligger i ett lag coachen tränar. ADMIN och CHAIRMAN får göra det i alla lag.
        Annars 403 "Only ADMIN, CHAIRMAN, or a coach of this team can manage its players" (även om `team_id` saknas).
        För en tränare är ett id som saknas samma 403 (F8). ADMIN och CHAIRMAN får 404 "User not found" när id saknas.
        Övriga fel är 400:
        "Only a PLAYER can be removed this way", "Player is already inactive".
        Spelarens redan utfärdade JWT nekas med 401 från och med nästa anrop, så länge kontot är inaktivt.
      x-roles: [ADMIN, CHAIRMAN, COACH]
      x-scope: COACH endast spelare i lag där hen finns i `team_coaches`. ADMIN och CHAIRMAN alla lag.
      x-source: UserController.softDeletePlayer → UserService.softDeletePlayer
      responses:
        '204':
          description: Spelaren är inaktiverad.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/users/{id}/role:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      tags: [Users]
      operationId: changeUserRole
      summary: Byt roll på en användare
      description: |
        ADMIN får byta till vilken roll som helst, även sin egen.
        Den som inte är ADMIN får inte byta sin egen roll. Svaret är 403
        "You cannot change your own role".
        CHAIRMAN får bara byta en annan användares roll från PLAYER till COACH.
        Om CHAIRMAN försöker sätta rollen ADMIN eller CHAIRMAN blir det 403
        "CHAIRMAN cannot assign the role ADMIN or CHAIRMAN".
        Annat byte blir 403 "CHAIRMAN may only change a PLAYER to COACH".
        COACH, PLAYER och PARENT får 403. På controllern är det "Access Denied".
        Om anropet når service-lagret och gäller den egna användaren är texten
        "You cannot change your own role".
        Okänd roll är 400 "This role does not exist". Saknad användare är 404 "User not found".

        När en PLAYER blir COACH töms `parentId`, `playerNumber` och `teamId` (ADR 0006, S1-8).
        Förälderns eget konto ligger kvar, men kopplingen tas bort.
        Tröjnumret blir ledigt. Personen lämnar spelarlistan.
        Ingen rad skapas i `team_coaches`. Koppling till lag som tränare är ett eget anrop.

        Efter bytet måste personen logga in igen för att få en token med den nya rollen.
        Den gamla JWT:n har kvar den tidigare rollen. Filtret läser databasen och
        svarar 401 på nästa anrop, tills personen loggar in igen eller rollen
        ändras tillbaka så att den stämmer med token.
      x-roles: [ADMIN, CHAIRMAN]
      x-scope: |
        CHAIRMAN får bara byta en annan användares PLAYER till COACH och får aldrig sätta ADMIN eller CHAIRMAN.
        ADMIN får sätta vilken roll som helst, även sin egen. Övriga får inte byta sin egen roll.
        PLAYER till COACH tömmer föräldralänk, tröjnummer och `teamId`.
      x-source: UserController.updateUserRole → UserService.changeUserRole
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeRoleRequest' }
      responses:
