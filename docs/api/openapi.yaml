      tags: [Matches]
      operationId: listMatchAttendance
      summary: Lista närvaro för en match
      description: |
        Samma regel som för träningar (ADR 0010, #67).
        Öppen match (`attendanceLockedAt` null): lagets aktiva spelare (roll PLAYER) just nu, med sparad
        status eller `status: null`. En spelare som har slutat eller bytt lag syns inte längre.
        Fryst match: exakt de sparade raderna. Den som har slutat finns kvar, den som har kommit senare syns inte.
        Automatisk frysning: om klockan är mer än 8 timmar efter `kickoffAt` (svensk tid; en match har ingen
        sluttid, så ca 2 timmar match + 6 timmar) fryses matchen först, med de rader som redan är sparade.
        Inget läggs till och inget tas bort.
        Fel: "Match not found" (404 för ADMIN och CHAIRMAN), "Player not found" (404);
        "Only ADMIN, CHAIRMAN, or a coach of this team can manage matches" (403 för en COACH när matchen
        saknas eller hör till ett annat lag); PLAYER och PARENT får 403 `{"message":"Access Denied"}`.
      x-roles: [ADMIN, CHAIRMAN, COACH]
      x-scope: ADMIN och CHAIRMAN alla lag. COACH endast lag där hen finns i `team_coaches`.
