  /api/trainings:
    get:
      tags: [Trainings]
      operationId: listTrainingsByTeam
      summary: Lista ett lags träningar (senaste först, eller filtrerat med when)
      description: |
        ADMIN och CHAIRMAN får lista träningar för vilket lag som helst.
        COACH bara lag där hen finns i `team_coaches`.
        Fel: "teamId is required" (400; saknad parameter ger Springs standard-400);
        "Only ADMIN, CHAIRMAN, or a coach of this team can manage trainings" (403 från service);
        PLAYER och PARENT får 403 `{"message":"Access Denied"}` från `@PreAuthorize` innan servicen körs;
        "Team not found" (404).
        Obs: behörighet kontrolleras före existens, så en COACH får 403 även för ett lag som inte finns.
      x-roles: [ADMIN, CHAIRMAN, COACH]
      x-scope: ADMIN och CHAIRMAN alla lag. COACH endast lag där hen finns i `team_coaches`.
      x-source: TrainingController.listByTeam → TrainingService.listByTeam
      parameters:
        - name: teamId
          in: query
          required: true
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/ActivityWhenQuery'
      responses:
        '200':
          description: Träningar.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TrainingResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Trainings]
      operationId: createTraining
      summary: Skapa träning
      description: |
        Skapar träningen. Inga närvarorader kopieras: medan träningen är öppen följer närvarolistan lagets spelare (#86).
        `type` krävs: `FOOTBALL` (Fotbollsträning) eller `FITNESS` (Fysträning) (#118). `createdByUserId` sätts till den inloggade.
        ADMIN och CHAIRMAN får skapa träningen på vilket lag som helst, utan rad i `team_coaches`.
        Starttiden får inte ligga före nu (datum och klockslag, svensk tid Europe/Stockholm), annars 400 (#115).
        ADMIN är undantagen och får sätta vilken tid som helst.
        Fel: "teamId is required", "startsAt and endsAt are required", "endsAt must be after startsAt",
        "Träningstyp krävs (FOOTBALL eller FITNESS)", "Okänd träningstyp. Välj FOOTBALL eller FITNESS",
        "Starttiden har redan passerat. Välj en tid som inte har varit." (400, inte ADMIN);
        "Only ADMIN, CHAIRMAN, or a coach of this team can manage trainings" (403 från service om COACH inte tränar laget, kontrolleras först);
        PLAYER och PARENT får 403 `{"message":"Access Denied"}` från `@PreAuthorize`;
        "Team not found" (404).
      x-roles: [ADMIN, CHAIRMAN, COACH]
      x-scope: ADMIN och CHAIRMAN alla lag. COACH endast lag där hen finns i `team_coaches`.
      x-source: TrainingController.create → TrainingService.createTraining
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTrainingRequest' }
      responses:
        '201':
          description: Träningen skapad.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrainingResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/trainings/{id}:
    parameters:
      - $ref: '#/components/parameters/TrainingId'
    get:
      tags: [Trainings]
      operationId: getTrainingById
      summary: Hämta en träning
      description: |
        ADMIN och CHAIRMAN får hämta en träning i vilket lag som helst.
        Fel: "Training not found" (404);
        "Only ADMIN, CHAIRMAN, or a coach of this team can manage trainings" (403 om COACH inte tränar laget);
        PLAYER och PARENT får 403 `{"message":"Access Denied"}`.
      x-roles: [ADMIN, CHAIRMAN, COACH]
      x-scope: ADMIN och CHAIRMAN alla lag. COACH endast lag där hen finns i `team_coaches`.
      x-source: TrainingController.getById → TrainingService.getById
      responses:
        '200':
          description: Träningen.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrainingResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Trainings]
      operationId: updateTraining
      summary: Ändra tid, plats och träningstyp
      description: |
        Byter `startsAt`, `endsAt`, `type` och `venue`. Laget ändras inte, så närvaroraderna ligger kvar.
        Samma skrivare som när träningen skapas. En inställd träning kan fortfarande rättas.
        `type` krävs, precis som vid skapande. Tom `venue` rensar platsen.
        En ny `startsAt` får inte ligga före nu (svensk tid), annars 400 (#115). ADMIN är undantagen.
        Kontrollen görs bara när `startsAt` ändras: att byta plats på en gammal träning med samma tid går igenom.
        Fel: "startsAt and endsAt are required", "endsAt must be after startsAt",
        "Träningstyp krävs (FOOTBALL eller FITNESS)", "Okänd träningstyp. Välj FOOTBALL eller FITNESS",
        "Starttiden har redan passerat. Välj en tid som inte har varit." (400, inte ADMIN);
        "Training not found" (404);
        "Only ADMIN, CHAIRMAN, or a coach of this team can manage trainings" (403 om COACH inte tränar laget);
        PLAYER och PARENT får 403 från `@PreAuthorize`.
      x-roles: [ADMIN, CHAIRMAN, COACH]
      x-scope: ADMIN och CHAIRMAN alla lag. COACH endast lag där hen finns i `team_coaches`.
      x-source: TrainingController.update → TrainingService.updateTraining
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTrainingRequest' }
      responses:
        '200':
          description: Träningen uppdaterad.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrainingResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/trainings/{id}/cancellation:
    parameters:
      - $ref: '#/components/parameters/TrainingId'
    put:
      tags: [Trainings]
      operationId: cancelTraining
      summary: Ställ in en träning, eller aktivera den igen
      description: |
        Sätter status CANCELLED. Träningen raderas inte. Närvaroraderna ligger kvar.
        `reason` är valfri. Tom text sparas som null.
        Det går inte att markera närvaro på en inställd träning (400 "This training is cancelled").
        Med `cancelled: false` aktiveras träningen igen: status blir SCHEDULED, `cancelReason` blir null
        och närvaro går att markera igen. `reason` ignoreras då. Saknas `cancelled` betyder det `true`.
        Att aktivera en träning som inte är inställd ändrar inget (200).
        Samma skrivare som när träningen skapas.
        Spelare och föräldrar ser statusen i `GET /api/my/trainings`. Personal ser den i lagets lista.
        Fel: "Training not found" (404);
        "Only ADMIN, CHAIRMAN, or a coach of this team can manage trainings" (403 om COACH inte tränar laget);
        PLAYER och PARENT får 403 från `@PreAuthorize`.
      x-roles: [ADMIN, CHAIRMAN, COACH]
      x-scope: ADMIN och CHAIRMAN alla lag. COACH endast lag där hen finns i `team_coaches`.
      x-source: TrainingController.cancel → TrainingService.cancelTraining
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelTrainingRequest' }
      responses:
        '200':
          description: Träningen är inställd, eller aktiverad igen med `cancelled` false.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrainingResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/trainings/{id}/attendance:
    parameters:
      - $ref: '#/components/parameters/TrainingId'
    get:
      tags: [Trainings]
      operationId: listAttendance
      summary: Lista närvaro för en träning
      description: |
        ADMIN och CHAIRMAN får lista närvaro för en träning i vilket lag som helst.
        Listan finns kvar när träningen är inställd.
        Öppen träning (`attendanceLockedAt` null): lagets aktiva spelare (roll PLAYER) just nu, med sparad
        status eller `status: null`. En spelare som har slutat eller bytt lag syns inte längre.
        Fryst träning: exakt de sparade raderna. Den som har slutat finns kvar, den som har kommit senare syns inte.
        Automatisk frysning (#86): om träningen inte är inställd och klockan är mer än 6 timmar efter `endsAt`
        (svensk tid) fryses den först, med de rader som redan är sparade. Inget läggs till och inget tas bort.
        Fel: "Training not found", "Player not found" (404);
        "Only ADMIN, CHAIRMAN, or a coach of this team can manage trainings" (403 om COACH inte tränar laget);
        PLAYER och PARENT får 403 `{"message":"Access Denied"}`.
      x-roles: [ADMIN, CHAIRMAN, COACH]
      x-scope: ADMIN och CHAIRMAN alla lag. COACH endast lag där hen finns i `team_coaches`.
      x-source: TrainingController.listAttendance → TrainingService.listAttendance
      responses:
        '200':
          description: Närvarorader.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AttendanceResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/trainings/{id}/attendance/lock:
    parameters:
      - $ref: '#/components/parameters/TrainingId'
    put:
      tags: [Trainings]
      operationId: lockAttendance
      summary: Frys närvarolistan ("Klar")
      description: |
        Alla spelare på den levande listan måste ha en status först. Finns minst en omarkerad spelare
        (`status: null`) ges 400 och listan förblir öppen. Ett lag utan spelare kan frysas direkt.
        Sparar en rad för varje spelare på den levande listan, tar bort sparade
        rader för spelare som inte längre är med på listan och sätter `attendanceLockedAt`. Ingen body.
        Efter det visar `GET .../attendance` alltid den frysta listan och markering ger 400.
        Att frysa en redan fryst träning ändrar inget (200, samma `attendanceLockedAt`), även om
        listan har omarkerade spelare (t.ex. efter automatisk frysning).
        Samma roller och lagavgränsning som att markera närvaro.
        Fel: "This training is cancelled" (400);
        "All players must be marked before the attendance list can be frozen" (400); "Training not found" (404);
        "Only ADMIN, CHAIRMAN, or a coach of this team can manage trainings" (403 om COACH inte tränar laget);
        PLAYER och PARENT får 403 `{"message":"Access Denied"}`.
      x-roles: [ADMIN, CHAIRMAN, COACH]
      x-scope: ADMIN och CHAIRMAN alla lag. COACH endast lag där hen finns i `team_coaches`.
