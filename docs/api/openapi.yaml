  /api/users/{id}/password-reset:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Users]
      operationId: resetUserPassword
      summary: Återställ en användares lösenord
      description: |
        Skapar ett nytt tillfälligt lösenord på samma sätt som när ett konto skapas,
        sparar bara hashen och sätter `mustChangePassword = true`. Lösenordet i klartext
        finns bara i det här svaret (#128).
        Alla äldre JWT:er för kontot slutar fungera: `passwordChangedAt` flyttas, och
        filtret svarar 401 på en token som utfärdades en tidigare sekund.

        Ingen får återställa sitt eget lösenord. Svaret är 403
        "You cannot reset your own password. Use change password instead".
        CHAIRMAN får inte återställa ADMIN eller CHAIRMAN. Svaret är 403
        "CHAIRMAN cannot reset the password of an ADMIN or CHAIRMAN".
        COACH, PLAYER och PARENT får 403 "Access Denied" på controllern.
        Saknat id och inaktivt konto är 404 "User not found".
      x-roles: [ADMIN, CHAIRMAN]
      x-scope: |
        ADMIN får återställa alla utom sig själv.
        CHAIRMAN får återställa alla utom ADMIN och CHAIRMAN (samma regel som rollbyte), alltså inte sig själv.
      x-source: UserController.resetPassword → UserService.resetPassword
      responses:
        '200':
          description: Nytt tillfälligt lösenord. Visas en gång.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordResetResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/users/{id}/player:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      tags: [Users]
      operationId: updatePlayer
      summary: Uppdatera en spelare (och kopplad förälder)
      description: |
        Bara för aktiv PLAYER. `name`, `email` och `teamId` krävs (laget måste finnas). E-post, telefon och
        tröjnummer måste vara unika. `parentId` byter förälder (måste vara aktiv PARENT).
        `parentName`/`parentEmail`/`parentMobilePhoneNumber` uppdaterar den kopplade förälderns rad
        (null = lämna orört; tom `parentMobilePhoneNumber` rensar telefonnumret; tom `parentEmail` → 400).
        Tom `mobilePhoneNumber` rensar spelarens nummer.
        COACH måste träna både spelarens nuvarande lag och `teamId` i kroppen. ADMIN och CHAIRMAN har ingen laggräns.
        Annars 403 "Only ADMIN, CHAIRMAN, or a coach of this team can manage its players".
        Nuvarande lag kontrolleras före övriga fel, så en coach för ett annat lag får 403 i stället för 400
        som beskriver spelaren. Ett id som saknas är samma 403 för tränaren (F8).
        ADMIN och CHAIRMAN får 404 "User not found" när id saknas.
        Nytt lag kontrolleras före "Team not found", så ett okänt lag-id ger 403 för COACH.
        Okänt lag för ADMIN eller CHAIRMAN är 400 "Team not found".
        Fel: "Only a PLAYER can be updated with this endpoint", "Cannot edit an inactive player",
        "Name is required", "Email is required", "teamId is required (change team, do not clear it)",
        "Team not found", "Email already in use", "Phone number already in use", "Shirt number already in use",
        "Parent user not found", "parentId must point to a user with role PARENT", "Cannot link an inactive parent",
        "Parent email is required" (400); "User not found" (404).
      x-roles: [ADMIN, CHAIRMAN, COACH]
      x-scope: COACH bara om hen tränar både nuvarande lag och det nya `teamId`. ADMIN och CHAIRMAN alla lag.
      x-source: UserController.updatePlayer → UserService.updatePlayer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePlayerRequest' }
      responses:
        '200':
          description: Uppdaterad spelare.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FetchUserResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

