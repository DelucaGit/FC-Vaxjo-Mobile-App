        "Only ADMIN, CHAIRMAN, or a coach of this team can manage matches" (403 från service);
        PLAYER och PARENT får 403 från `@PreAuthorize` innan servicen körs;
        "Team not found" (404).
        Behörighet kontrolleras före existens, så en COACH får 403 även för ett lag som inte finns.
        Svaret har ingen e-post och ingen telefon.
      x-roles: [ADMIN, CHAIRMAN, COACH]
      x-scope: ADMIN och CHAIRMAN alla lag. COACH endast lag där hen finns i `team_coaches`.
      x-source: MatchController.listByTeam → MatchService.listByTeam
      parameters:
        - name: teamId
          in: query
          required: true
          schema: { type: integer, format: int64 }
