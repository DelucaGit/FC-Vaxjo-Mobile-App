        Samma roller och lagavgränsning som att markera närvaro.
        Fel: "All players must be marked before the attendance list can be frozen" (400);
        "Match not found" (404 för ADMIN och CHAIRMAN);
        "Only ADMIN, CHAIRMAN, or a coach of this team can manage matches" (403);
